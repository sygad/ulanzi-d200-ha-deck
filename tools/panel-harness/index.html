<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ulanzi Deck panel harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>body{margin:0}</style></head><body>
<script type="module">
// A pretend Home Assistant: enough of `hass` for the panel to run on a desk.
import "/ulanzi_deck_static/panel.js";
const data = await (await fetch("data.json")).json();
const blank = new URLSearchParams(location.search).has("blank");
let draft = blank ? [{name: "Screen 1", icon: "", keys: Array(14).fill(null)}] : data.pages, published = null;
let settings = {sleep: 20}, publishedSettings = null;
let status = {bridge: "pending", bridge_name: null, pending: {bridge_id: "b1", name: "Desk Mac"}, deck: false, screen: 0};
let statusCb = null;
window.calls = [];
const hass = {
  states: data.states, entities: data.entities, devices: {}, areas: data.areas, dockedSidebar: "docked",
  async callWS(m) {
    window.calls.push(m.type);
    if (m.type === "ulanzi_deck/get") return {pages: structuredClone(draft), published,
      settings: structuredClone(settings), published_settings: publishedSettings, status};
    if (m.type === "ulanzi_deck/save") { draft = structuredClone(m.pages); if (m.settings) settings = structuredClone(m.settings); return null; }
    if (m.type === "ulanzi_deck/publish") { draft = structuredClone(m.pages); published = structuredClone(m.pages);
      if (m.settings) settings = structuredClone(m.settings);
      publishedSettings = structuredClone(settings);
      return {published, published_settings: publishedSettings, status}; }
    if (m.type === "ulanzi_deck/press") { return press(m); }
    if (m.type === "ulanzi_deck/allow") { status = {...status, bridge: "connected", bridge_name: "Desk Mac", pending: null, deck: true}; statusCb && statusCb(status); return {allowed: true}; }
    if (m.type === "history/history_during_period") {
      const id = m.entity_ids[0], h = data.hist[id] || [], t0 = Date.now() / 1000 - 24 * 3600;
      return {[id]: h.map((v, i) => ({s: String(v), lu: t0 + (i + 0.5) * 3600}))};
    }
    throw new Error("unknown command " + m.type);
  },
  connection: {async subscribeMessage(cb) { statusCb = cb; cb(status); return () => { statusCb = null; }; }},
};
// Preview mode: do to the pretend states what the real service call would do, so a
// key pressed in the preview visibly changes, as it does against a real server.
const OFF = new Set(["off", "closed", "unavailable", "unknown"]);
function press(m) {
  const key = (draft[m.screen] || {keys: []}).keys[m.key];
  if (!key || key.type !== "button") return null;
  const slot = key[m.gesture || "tap"] || {}, action = slot.a || "none", target = slot.t || "";
  const st = target && hass.states[target];
  if (!st) return null;
  const now = new Date().toISOString();
  const set = v => { hass.states[target] = {...st, state: v, last_changed: now, last_updated: now}; };
  if (action === "light.toggle" || action === "switch.toggle" || action === "cover.toggle")
    set(OFF.has(st.state) ? (action === "cover.toggle" ? "open" : "on") : (action === "cover.toggle" ? "closed" : "off"));
  else if (action.endsWith(".turn_on") || action === "cover.open_cover") set(action === "cover.open_cover" ? "open" : "on");
  else if (action.endsWith(".turn_off") || action === "cover.close_cover") set(action === "cover.close_cover" ? "closed" : "off");
  el.hass = {...hass, states: {...hass.states}};      // the panel repaints when hass changes
  return null;
}

const el = document.createElement("ulanzi-deck-panel");
el.hass = hass; el.narrow = false;
document.body.appendChild(el);
window.panel = el; window.hass = hass;

// ?settings opens the deck settings dialog, so it can be screenshotted headless.
const q = new URLSearchParams(location.search);
if (q.has("settings") || q.has("connected")) {
  // A settled deck: connected, everything on the same release, nothing to do.
  status = {...status, bridge: "connected", bridge_name: "Desk Mac", pending: null, deck: true,
            app_version: "4.8", bridge_version: "4.8", deck_firmware: "4.8",
            deckd_available: "4.8", latest_release: "4.8", on_disk_version: "4.8",
            restart_pending: false};
  statusCb && statusCb(status);
  if (q.has("settings")) {
    const open = () => {
      const b = el.shadowRoot && el.shadowRoot.getElementById("btn-settings");
      if (b) b.click(); else setTimeout(open, 50);
    };
    setTimeout(open, 300);
  }
}
</script></body></html>
